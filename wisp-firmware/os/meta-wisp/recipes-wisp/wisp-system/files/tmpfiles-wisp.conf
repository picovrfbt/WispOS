# Wisp's data lives on the data partition, which the board mounts at /var
d /var/local 0755 root root -
d /var/local/etc 0755 root root -
d /var/local/etc/go-librespot 0755 root root -
d /var/local/lib 0755 root root -
d /var/local/wisp 0755 root root -
d /var/local/wisp/app 0755 root root -
d /var/local/wisp/voice 0755 root root -
d /var/local/wisp/voice/cache 0755 root root -
d /var/cache/wisp 0755 root root -
d /var/log/go-librespot 0755 root root -
d /var/lib/ssh/authorized_keys 0700 root root -
