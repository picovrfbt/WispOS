# Wisp's additions to the board's kernel config.

# Internet from the phone: Bluetooth PAN (bnep0)
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y

# Internet from a PC comes over the board's CDC-NCM gadget (CONFIG_USB_F_NCM),
# which Windows 11, macOS and Linux all drive without a driver install

# the firewall: sshd is closed on the Bluetooth link (bnep0)
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_COMPAT=y
# iptables here is the legacy backend: its core has to be built in, or the
# filter tables it needs come out as modules the image doesn't carry
CONFIG_IP_NF_IPTABLES_LEGACY=y
CONFIG_IP6_NF_IPTABLES_LEGACY=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_TARGET_REJECT=y
CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_TARGET_REJECT=y
CONFIG_NETFILTER_XT_MATCH_TCPMSS=y

# Bluetooth's debugfs, for the shorter advertising interval phones find the knob's HID by
CONFIG_DEBUG_FS=y
