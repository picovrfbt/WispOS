require conf/distro/superbird.conf

DISTRO = "wisp"
DISTRO_NAME = "Wisp OS"
# the Wisp release this image is built as (scripts/prepare.sh writes it)
include conf/distro/include/wisp-version.inc
WISP_VERSION ??= "0.0.0"
DISTRO_VERSION = "${WISP_VERSION}"

SUPERBIRD_HOSTNAME = "wisp"
SUPERBIRD_MDNS_SERVICE_NAME = "Wisp"
SUPERBIRD_USB_GADGET_NAME = "wisp"
SUPERBIRD_USB_GADGET_MANUFACTURER = "Wisp"
SUPERBIRD_USB_GADGET_PRODUCT = "Wisp"

# Wisp's boot logo (shown by u-boot) and splash (behind the kiosk until the UI
# draws), in place of the board's Thing Labs ones; both match the starting-up screen
SUPERBIRD_BOOT_LOGO_NAME = "wisp-bootup.bmp"
SUPERBIRD_WESTON_SPLASH_IMAGE = "wisp-splash.png"

# Wisp's screen, served on the Car Thing by wisp-ui
CHROMIUM_KIOSK_URL = "http://localhost/"

# the voice stack and Chromium together outgrow the default 516 MiB root;
# the data partition (Wisp's /var/local) takes what's left of the eMMC
SUPERBIRD_ROOT_PART_SIZE = "900"
