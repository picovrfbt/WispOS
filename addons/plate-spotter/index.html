<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plate spotter</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { padding: 20px 24px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .count { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .of { font-size: 20px; color: rgba(255,255,255,.55); }
  .name { margin-left: auto; font-size: 24px; font-weight: 600; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(13, 1fr); grid-auto-rows: 1fr; gap: 6px; }
  .s { display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 17px; font-weight: 700; color: rgba(255,255,255,.5); border: 2px solid transparent; }
  .s.seen { background: #1ed760; color: #000; }
  .s.on { border-color: #fff; color: #fff; }
  .s.seen.on { color: #000; }
  .s.reset { grid-column: span 2; font-size: 14px; font-weight: 600; }
  .s.reset.armed { background: #e5484d; color: #fff; }
</style>
</head>
<body>
<div class="head"><div class="count" id="count">0</div><div class="of">of 51 seen</div><div class="name" id="name"></div></div>
<div class="grid" id="grid"></div>
<script src="/addons/sdk.js"></script>
<script>
  var STATES = [
    ['AL', 'Alabama'], ['AK', 'Alaska'], ['AZ', 'Arizona'], ['AR', 'Arkansas'], ['CA', 'California'], ['CO', 'Colorado'],
    ['CT', 'Connecticut'], ['DE', 'Delaware'], ['DC', 'Washington, D.C.'], ['FL', 'Florida'], ['GA', 'Georgia'], ['HI', 'Hawaii'],
    ['ID', 'Idaho'], ['IL', 'Illinois'], ['IN', 'Indiana'], ['IA', 'Iowa'], ['KS', 'Kansas'], ['KY', 'Kentucky'],
    ['LA', 'Louisiana'], ['ME', 'Maine'], ['MD', 'Maryland'], ['MA', 'Massachusetts'], ['MI', 'Michigan'], ['MN', 'Minnesota'],
    ['MS', 'Mississippi'], ['MO', 'Missouri'], ['MT', 'Montana'], ['NE', 'Nebraska'], ['NV', 'Nevada'], ['NH', 'New Hampshire'],
    ['NJ', 'New Jersey'], ['NM', 'New Mexico'], ['NY', 'New York'], ['NC', 'North Carolina'], ['ND', 'North Dakota'], ['OH', 'Ohio'],
    ['OK', 'Oklahoma'], ['OR', 'Oregon'], ['PA', 'Pennsylvania'], ['RI', 'Rhode Island'], ['SC', 'South Carolina'], ['SD', 'South Dakota'],
    ['TN', 'Tennessee'], ['TX', 'Texas'], ['UT', 'Utah'], ['VT', 'Vermont'], ['VA', 'Virginia'], ['WA', 'Washington'],
    ['WV', 'West Virginia'], ['WI', 'Wisconsin'], ['WY', 'Wyoming'],
  ]
  var seen = {}
  var focus = 0 // STATES.length is "Start over"
  var armed = false
  var $ = function (id) { return document.getElementById(id) }

  function draw() {
    var n = Object.keys(seen).length
    $('count').textContent = n
    $('name').textContent = focus < STATES.length ? STATES[focus][1] + (seen[STATES[focus][0]] ? ' ✓' : '') : armed ? 'Press again to clear' : 'Start over'
    $('grid').innerHTML = STATES.map(function (s, i) {
      return '<div class="s' + (seen[s[0]] ? ' seen' : '') + (i === focus ? ' on' : '') + '">' + s[0] + '</div>'
    }).join('') + '<div class="s reset' + (focus === STATES.length ? ' on' : '') + (armed ? ' armed' : '') + '">Start over</div>'
  }
  function save() { Wisp.storage.set('seen', Object.keys(seen)).catch(function () {}) }

  Wisp.on('knob', function (e) {
    armed = false
    focus = Math.max(0, Math.min(STATES.length, focus + e.delta))
    draw()
  })
  Wisp.on('press', function () {
    if (focus === STATES.length) {
      if (armed) { seen = {}; armed = false; save() } else armed = true
    } else {
      var k = STATES[focus][0]
      if (seen[k]) delete seen[k]
      else seen[k] = 1
      save()
    }
    draw()
  })
  Wisp.storage.get('seen').then(function (list) {
    if (Array.isArray(list)) list.forEach(function (k) { if (typeof k === 'string') seen[k] = 1 })
    draw()
  }).catch(function () {})
  draw()
</script>
</body>
</html>
